<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" x2="1">
      <stop offset="0" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b949e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9d1d9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="2" width="1200" height="2" fill="url(#base)"/>
  <rect y="2" width="220" height="2" fill="url(#glow)">
    <animate attributeName="x" from="-220" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
